# .github/workflows/scheduled_ingestion.yml

name: Hourly Data Ingestion

on:
  workflow_dispatch: # Allows you to run it manually from the Actions tab
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'

jobs:
  ingest-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Use the Python version of your project

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion script
        run: |
          python ingest_healthmap.py

      - name: Commit and push if database changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add backend/your_database_name.db # IMPORTANT: Add your DB file path
          git commit -m "Chore: Update database with new health alerts" || echo "No changes to commit"
          git push || echo "No changes to push"